# Author: Jeff
# Date: 2026-07-11
# Description: Spectre workspace root
# Notes: Workspace membership and shared dependency versions are explicit

[workspace]
resolver = "2"
members = [
    "crates/spectre-app",
    "crates/spectre-core",
    "crates/spectre-dsp",
    "crates/spectre-graph",
    "crates/spectre-offline",
    "crates/spectre-project",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1"
