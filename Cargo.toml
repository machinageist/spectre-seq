# ==============================================================================
# File: Cargo.toml
# Layer: workspace root
# Purpose: workspace root; active members = crates/* + app, CLAP/LV2 hosts excluded
# Status: Implemented.
# Contract: Keep comments terse, declarative, and synchronized with code.
# ==============================================================================

[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/*",
    "app/geist-daw",
]
exclude = [
    "crates/geist-clap-host",
    "crates/geist-lv2-host",
]
