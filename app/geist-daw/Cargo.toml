# ==============================================================================
# File: app/geist-daw/Cargo.toml
# Layer: application binary
# Purpose: Main binary; wires backend, graph node, and a demo sequencer together.
# Status: Implemented; minimal audible binary streaming the synth.
# Contract: Keep comments terse, declarative, and synchronized with code.
# ==============================================================================

[package]
name = "geist-daw"
version = "0.1.0"
edition = "2021"

[dependencies]
# AudioConfig, ProcessContext, note events, transport snapshot
spectre-core = { path = "../../crates/spectre-core" }
# AudioNode trait the synth node implements
spectre-graph = { path = "../../crates/spectre-graph" }
# cpal backend, block bridge, stream config
spectre-audio-backend = { path = "../../crates/spectre-audio-backend" }
# Flagship synth exposed as an AudioNode
spectre-synth = { path = "../../plugins/spectre-synth" }
# Effects nodes for the post-synth device chain
spectre-fx = { path = "../../plugins/spectre-fx" }
# Transport and tempo for the DAW playhead
spectre-timeline = { path = "../../crates/spectre-timeline" }
# Project file format for saving and loading the session patch
spectre-project = { path = "../../crates/spectre-project" }
# Lock-free SPSC queue for UI-to-audio commands
rtrb = "0.3.4"
# Immediate-mode GUI and native windowing/event loop
eframe = "0.34"
# Tactile-dark theme and Knob/Fader/Meter widgets for the front-end
spectre-ui = { path = "../../crates/spectre-ui" }
# Workflow profile parsing and startup precedence
spectre-config = { path = "../../crates/spectre-config" }
# WAV encoding for recorded audio clips
hound = "3.5"
# Native/portal file picker for manually relinking offline takes
rfd = "0.17.2"
