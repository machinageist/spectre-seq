# ==============================================================================
# File: crates/geist-stacksynth/Cargo.toml
# Layer: internal synth device (generator-stack synth)
# Purpose: Generator-stack modular synth per docs/specs/geist-modular-synth-spec.md
# Status: S0 implemented; patch schema + validation, no DSP yet.
# Contract: Keep comments terse, declarative, and synchronized with code.
# ==============================================================================

[package]
name = "geist-stacksynth"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared DSP primitives (note->Hz, oscillators, noise) reused by the render path
geist-dsp = { path = "../geist-dsp" }
# Schema DTOs are serde-first, mirroring geist-project's decoupled wire style
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Round-trip tests for the patch schema
serde_json = "1"
