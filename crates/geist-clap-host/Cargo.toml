# ==============================================================================
# File: crates/geist-clap-host/Cargo.toml
# Layer: CLAP host
# Purpose: CLAP plugin host; wraps clap-sys raw FFI in a safe Rust API.
# Status: Implemented incrementally; scanner first. FFI deps land with that slice.
# Contract: Keep comments terse, declarative, and synchronized with code.
# ==============================================================================

[package]
name = "geist-clap-host"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared primitives: AudioConfig and the realtime ProcessContext
geist-core = { path = "../geist-core" }
# AudioNode trait a hosted plugin slots into
geist-graph = { path = "../geist-graph" }
# Raw CLAP ABI bindings; all FFI types and the entry/factory contracts
clap-sys = "0.5"
# Open a .clap shared library and resolve its clap_entry symbol
libloading = "0.8"
# Bridge the app window into a CLAP parent window for GUI embedding
raw-window-handle = "0.6"
# Serialize the scanner metadata cache; CBOR matches the project format (ADR-003)
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
