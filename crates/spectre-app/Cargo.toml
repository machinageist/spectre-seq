# Author: Jeff
# Date: 2026-07-12
# Description: Launchable Spectre interaction prototype
# Notes: Native egui shell over the spectre-audio seam; the render graph is reached only
#   through the compiled plan the engine module builds

[package]
name = "spectre-app"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["live-audio"]
# Default-on so the real backend is always type-checked and linted, mirroring spectre-audio
live-audio = ["spectre-audio/cpal-backend"]

[dependencies]
# x11 and wayland are winit's Linux platform backends. With default-features off and neither
# named, winit's platform_impl matches no platform and emits compile_error!, so the workspace
# does not build on Linux at all; macOS is unaffected because macos_platform keys off target_os.
# accesskit stays off deliberately — r4-qa-protocol.md row 13 records that consequence
eframe = { version = "0.32.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
spectre-audio = { path = "../spectre-audio", default-features = false }
spectre-core = { path = "../spectre-core" }
spectre-dsp = { path = "../spectre-dsp" }
spectre-graph = { path = "../spectre-graph" }
spectre-project = { path = "../spectre-project" }
# Ordinary dependency as of R4-8's bounce panel. spectre-offline dev-depends on spectre-app in
# return; Cargo permits a cycle that closes through a dev-dependency, verified here with
# cargo metadata and a clean build rather than assumed
spectre-offline = { path = "../spectre-offline" }
serde.workspace = true
serde_json.workspace = true
