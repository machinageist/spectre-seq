# ==============================================================================
# File: crates/geist-graph/Cargo.toml
# Layer: audio graph
# Purpose: Define Cargo responsibilities and integration boundaries.
# Status: Implemented; full graph engine (topology, compilation, executor, swap, channels).
# Contract: Keep comments terse, declarative, and synchronized with code.
# ==============================================================================

[package]
name = "geist-graph"
version = "0.1.0"
edition = "2021"

# Disable the default libtest bench harness so cargo bench runs only criterion
[lib]
bench = false

[dependencies]
geist-core = { path = "../geist-core" }
rtrb = "0.3.4"

[dev-dependencies]
criterion = "0.8.2"

# Validates the 128-node compile + swap target on the app thread
[[bench]]
name = "graph_bench"
harness = false
