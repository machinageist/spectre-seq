# ==============================================================================
# File: crates/spectre-ui/Cargo.toml
# Layer: UI
# Purpose: UI state, commands, renderer abstraction, views, and tactile widgets
# Status: Implemented incrementally; egui renderer + tactile-dark theme/widgets.
# Contract: Keep comments terse, declarative, and synchronized with code.
# ==============================================================================

[package]
name = "spectre-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workflow profiles, lenses, panels, and typed command intents
spectre-config = { path = "../spectre-config" }
# Immediate-mode GUI; the concrete renderer behind the Renderer trait (wgpu later)
egui = "0.34"

[dev-dependencies]
# Native window shell for the widget gallery example only
eframe = "0.34"
