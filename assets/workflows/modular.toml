version = 1
profile_id = "modular-builder"
display_name = "Modular Builder"
startup_lens = "build"

[lenses]
order = ["build", "shape", "modulation", "arrange", "mix", "browser"]
visible = ["build", "shape", "modulation", "arrange", "mix", "browser"]

[layout]
density = "normal"
left_panel = "browser"
right_panel = "context_shelf"
bottom_panel = "modulation_overview"
transport = "top"

[graph]
cable_labels = "on_hover"
show_latency = true
show_route_health = true
empty_actions = ["add_source", "add_processor", "add_modulator", "open_browser"]

[context_shelf.track]
actions = ["add_instrument", "add_effect", "add_send", "arm", "mute", "solo", "show_graph_branch"]

[commands.aliases]
"Patch LFO" = { command = "add_modulator", kind = "lfo" }
"Add Output" = { command = "add_node", node = "audio_output" }
"Trace Signal" = { command = "trace_selected_route" }

[keybindings]
"Cmd+K" = "open_command_palette"
"G" = "switch_lens:build"
"M" = "switch_lens:modulation"

[[templates]]
name = "Synth Voice Branch"
kind = "graph"
args = { source = "spectre_synth", processors = "filter,delay", output = "master" }

[[templates]]
name = "Macro Mod Lane"
kind = "modulation"
args = { source = "lfo", target = "selected_parameter", depth = "0.25" }
