version = 1
profile_id = "default"
display_name = "Default"
startup_lens = "arrange"

[lenses]
order = ["arrange", "build", "shape", "mix", "browser", "modulation"]
visible = ["arrange", "build", "shape", "mix", "browser", "modulation"]

[layout]
density = "normal"
left_panel = "browser"
right_panel = "context_shelf"
transport = "top"

[graph]
cable_labels = "on_hover"
show_latency = true
show_route_health = true
empty_actions = ["add_source", "add_processor", "add_modulator", "open_browser"]

[commands.aliases]
"Open Browser" = { command = "open_browser" }
"Add Track" = { command = "add_track" }

[keybindings]
"Cmd+K" = "open_command_palette"
"G" = "switch_lens:build"
"A" = "switch_lens:arrange"

[[templates]]
name = "Instrument Track"
kind = "track"
args = { role = "instrument", insert = "geist_synth" }

[[templates]]
name = "Mix Bus"
kind = "track"
args = { role = "bus", inserts = "eq,compressor" }
