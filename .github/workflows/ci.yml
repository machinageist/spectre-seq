# ==============================================================================
# File: .github/workflows/ci.yml
# Layer: CI
# Purpose: enforce the documented Validate commands from README.md on push/PR
# Status: active
# Contract: keep steps identical to README's "## Validate" section; single
#   ubuntu-latest job is a deliberate minimum, not a platform coverage claim
# Notes: Triggers on every branch, not just main. It used to watch main alone,
#   so the whole R4 slice series landed on gauntlet/r4-spec-phase without ever
#   being gated -- and the Linux build had been broken since the rebuild
#   foundation. CI had in fact failed on main on 2026-08-06 and 2026-08-16 for
#   exactly that reason and nobody read it. A gate nothing runs against is not
#   a gate.
# ==============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native UI and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Offline deterministic self-test
        run: cargo run --locked -p spectre-offline -- --self-test
